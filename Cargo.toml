[package]
name = "uur"
version = "0.1.4"
edition = "2021"
description = "Native Linux companion for NetEase UU Remote: X11/Wayland input and capture, packaged as a regular desktop app"
license = "MIT"
repository = "https://github.com/panxuc/uur"
default-run = "uur"

[dependencies]
anyhow = "1"
ashpd = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
libc = "0.2"
input-linux-sys = "0.9"
x11rb = { version = "0.13", features = ["xtest"] }
signal-hook = "0.3"
png = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
