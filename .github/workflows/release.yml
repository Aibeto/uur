name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to rebuild
        required: true
        type: string
      publish_aur:
        description: Publish or refresh the AUR package metadata
        required: false
        default: false
        type: boolean
      only_aur:
        description: Skip package builds and only publish AUR metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  conventional-packages:
    if: ${{ !inputs.only_aur }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 gcc libpipewire-0.3-dev libwayland-dev \
            gcc-mingw-w64-x86-64 pkg-config zstd
      - name: Install nFPM
        env:
          NFPM_VERSION: 2.47.0
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          nfpm --version
      - name: Build distribution packages
        run: ./packaging/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: conventional-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*-linux-*.tar.zst
          if-no-files-found: error

  arch-package:
    if: ${{ !inputs.only_aur }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm \
            cargo rust gcc pkgconf pipewire wayland \
            mingw-w64-gcc mingw-w64-binutils
      - name: Build native pacman package with makepkg
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc '
            cd "$1"
            CARGO_BUILD_JOBS=2 cargo build --release --locked
            ./hook/build.sh
            ./capture/build.sh
            ./packaging/build-arch-package.sh "$1/dist"
          ' _ "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.zst
            !dist/uur-debug-*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: [conventional-packages, arch-package]
    if: ${{ !inputs.only_aur }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package*'
          path: release-assets
          merge-multiple: true
      - name: Generate combined checksums
        working-directory: release-assets
        run: sha256sum -- *.deb *.rpm *.tar.zst > SHA256SUMS
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          --repo "$GITHUB_REPOSITORY"

  aur:
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    if: >-
      ${{ always() && (github.event_name == 'release' || inputs.publish_aur)
          && (inputs.only_aur || needs.publish.result == 'success') }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install publication tools
        run: pacman -Syu --noconfirm curl git openssh
      - name: Publish AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          useradd --create-home builder
          install -d -o builder -g builder -m0700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -H aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/aur /home/builder/.ssh/known_hosts
          chmod 0600 /home/builder/.ssh/aur /home/builder/.ssh/known_hosts
          git_ssh='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts'
          runuser -u builder -- env \
            HOME=/home/builder \
            GIT_SSH_COMMAND="$git_ssh" \
            RELEASE_TAG="$RELEASE_TAG" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            bash -lc '
              git clone ssh://aur@aur.archlinux.org/uur.git "$HOME/aur"
              cp "$1/packaging/aur/PKGBUILD" "$1/packaging/aur/uur.install" "$HOME/aur/"
              cd "$HOME/aur"
              version="${RELEASE_TAG#v}"
              sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
              source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
              digest="$(curl -fsSL "$source_url" | sha256sum | cut -d" " -f1)"
              sed -i "s/^sha256sums=.*/sha256sums=(\"$digest\")/" PKGBUILD
              makepkg --printsrcinfo > .SRCINFO
              git config user.name uur-release-bot
              git config user.email actions@users.noreply.github.com
              git add PKGBUILD uur.install .SRCINFO
              if git diff --cached --quiet; then
                echo "AUR metadata is already current"
                exit 0
              fi
              git commit -m "uur $version"
              git push
            ' _ "$GITHUB_WORKSPACE"
